name: ci

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Typecheck
        run: mypy src

      - name: Tests (sandboxed HOME)
        run: |
          export HOME="$(mktemp -d)"
          touch "$HOME/canary"
          python -m pytest -q
          test -f "$HOME/canary"

      - name: Build wheel
        run: python -m build
